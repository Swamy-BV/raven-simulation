name: Host checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  formatting-and-harness:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format shellcheck
      - run: clang-format --dry-run --Werror src/*.cpp src/*.h
      - run: shellcheck -x scripts/*.sh
      - run: python3 -m compileall -q tests
      - run: python3 -m unittest discover -s tests -v
